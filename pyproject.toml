[project]
name = "machinelearning-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MSMRo", email = "moises.meza@upch.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "drawdata>=0.5.2",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pygls>=2.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
machinelearning-course = "machinelearning_course:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
